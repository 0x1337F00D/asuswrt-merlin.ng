[package]
name = "mssl-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "=0.2.189"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14", default-features = false }
