[workspace]
members = [
    "bwdpi-compat",
    "clientlist",
    "httpd-parsers",
    "infosvr",
    "lltd",
    "nt-event",
    "ntp",
    "router-policy",
    "router-security",
    "router-fuzz",
    "router-vpn-audit",
    "router-diagnostics",
    "rstats",
    "wanduck-transition",
    "wsdd2",
    "wlif-policy",
    "zlib-shared",
    "zlib-static",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false
