name: Build GT-AX11000

on:
  push:
    branches:
      - main
      - codex/rust-porting
      - codex/network-hardening-2026
    paths:
      - release/**
      - .github/ci/gt-ax11000/**
      - .github/workflows/**
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: gt-ax11000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout CI overlay
        run: |
          set -euxo pipefail
          git init overlay
          git -C overlay remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C overlay sparse-checkout init --cone
          git -C overlay sparse-checkout set .github/ci/gt-ax11000
          git -C overlay fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git -C overlay checkout --detach FETCH_HEAD
          test "$(git -C overlay rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Checkout current upstream sources
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse --branch main \
            https://github.com/RMerl/asuswrt-merlin.ng.git source
          git -C source sparse-checkout set \
            release/src \
            release/src-rt \
            release/src-rt-5.02axhnd
          git -C source rev-parse HEAD

      - name: Checkout required toolchains
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse --branch master \
            https://github.com/RMerl/am-toolchains.git toolchains
          git -C toolchains sparse-checkout set \
            brcm-arm-hnd/crosstools-arm-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1 \
            brcm-arm-hnd/crosstools-aarch64-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1 \
            brcm-arm-hnd/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25 \
            brcm-arm-sdk/hndtools-armeabi-2011.09 \
            brcm-arm-sdk/hndtools-armeabi-2013.11
          git -C toolchains rev-parse HEAD

      - name: Record input revisions
        id: revisions
        run: |
          echo "upstream_sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "toolchains_sha=$(git -C toolchains rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          overlay_sha="$({
            sha256sum overlay/.github/ci/gt-ax11000/build.sh
            sha256sum overlay/.github/ci/gt-ax11000/patches/*.patch
            find overlay/.github/ci/gt-ax11000/rust -type f -not -path '*/target/*' \
              -print0 | sort -z | xargs -0 sha256sum
          } | sha256sum | cut -d' ' -f1)"
          echo "overlay_sha=$overlay_sha" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf autoconf-archive automake autopoint bc bison build-essential ccache \
            fakeroot flex gawk gettext gperf kmod libelf-dev libltdl-dev \
            liblzo2-dev liblzma-dev libncurses-dev libssl-dev libzstd-dev \
            libtext-unidecode-perl libtool-bin pkg-config qemu-user rsync texinfo unzip \
            uuid-dev xxd zlib1g-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal \
            --component clippy,rustfmt --target armv7-unknown-linux-gnueabi
          rustc +1.85.1 --version --verbose

      - name: Restore Rust build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/asuswrt-rust-target
          key: gt-ax11000-rust-v2-${{ runner.os }}-rust-1.85.1-${{ steps.revisions.outputs.toolchains_sha }}-${{ steps.revisions.outputs.upstream_sha }}-${{ steps.revisions.outputs.overlay_sha }}
          restore-keys: |
            gt-ax11000-rust-v2-${{ runner.os }}-rust-1.85.1-${{ steps.revisions.outputs.toolchains_sha }}-${{ steps.revisions.outputs.upstream_sha }}-

      - name: Test Rust components
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/asuswrt-rust-target
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt \
            --manifest-path overlay/.github/ci/gt-ax11000/rust/Cargo.toml \
            --all -- --check
          cargo +1.85.1 test \
            --manifest-path overlay/.github/ci/gt-ax11000/rust/Cargo.toml \
            --workspace --locked
          cargo +1.85.1 clippy \
            --manifest-path overlay/.github/ci/gt-ax11000/rust/Cargo.toml \
            --workspace --all-targets --locked -- -D warnings
          RUSTFLAGS="-Dwarnings -Ctarget-cpu=cortex-a9" cargo +1.85.1 check \
            --manifest-path overlay/.github/ci/gt-ax11000/rust/Cargo.toml \
            --workspace --locked --target armv7-unknown-linux-gnueabi

      - name: Run structured Rust fuzz gates
        env:
          RUST_FUZZ_CARGO_HOME: ${{ runner.temp }}/asuswrt-fuzz-cargo
          RUST_FUZZ_ITERATIONS: "250000"
          RUST_FUZZ_TARGET_DIR: ${{ runner.temp }}/asuswrt-rust-target
        run: |
          set -euo pipefail
          bash overlay/.github/ci/gt-ax11000/tests/rust-fuzz-smoke.sh

      - name: Verify C to Rust ABI fixtures
        env:
          RUST_C_ABI_CARGO_HOME: ${{ runner.temp }}/asuswrt-c-abi-cargo
          RUST_C_ABI_FIXTURE_DIR: ${{ runner.temp }}/asuswrt-c-abi-fixtures
          RUST_C_ABI_TARGET_DIR: ${{ runner.temp }}/asuswrt-rust-target
        run: |
          set -euo pipefail
          bash overlay/.github/ci/gt-ax11000/tests/c-abi-smoke.sh

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/asuswrt-ccache
          key: gt-ax11000-ccache-v1-${{ runner.os }}-${{ steps.revisions.outputs.toolchains_sha }}-${{ steps.revisions.outputs.upstream_sha }}-${{ steps.revisions.outputs.overlay_sha }}
          restore-keys: |
            gt-ax11000-ccache-v1-${{ runner.os }}-${{ steps.revisions.outputs.toolchains_sha }}-${{ steps.revisions.outputs.upstream_sha }}-
            gt-ax11000-ccache-v1-${{ runner.os }}-${{ steps.revisions.outputs.toolchains_sha }}-

      - name: Apply local CI overlay
        run: |
          set -euxo pipefail
          for patch in \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/local-features.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/gt-ax11000-wsl.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/fast-parallel-build.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/rust-components.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/security-hardening.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/wps-shell-hardening.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/wireless-policy-ui.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/runtime-policy.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/regulatory-profile-boot.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/wireless-service-testlab-stability.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/network-hardening.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/runtime-hardening-2026.patch" \
            "$GITHUB_WORKSPACE/overlay/.github/ci/gt-ax11000/patches/wifi-upstream-security.patch"
          do
            git -C source apply --recount --check "$patch"
            git -C source apply --recount "$patch"
          done
          git -C source status --short

      - name: Show disk usage before build
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh source toolchains overlay

      - name: Build firmware
        env:
          AM_TOOLCHAINS: ${{ github.workspace }}/toolchains
          ASUSWRT_APT_CACHE: ${{ runner.temp }}/asuswrt-apt
          ASUSWRT_BUILD_MODE: clean
          ASUSWRT_BUILD_WORKTREE: "1"
          ASUSWRT_CCACHE: "1"
          ASUSWRT_CCACHE_DIR: ${{ runner.temp }}/asuswrt-ccache
          ASUSWRT_CCACHE_MAXSIZE: 2G
          ASUSWRT_DIRECT_TOOLCHAIN: "1"
          ASUSWRT_FAKEBIN: ${{ runner.temp }}/asuswrt-fakebin
          ASUSWRT_HOSTTOOLS: ${{ runner.temp }}/asuswrt-hosttools
          ASUSWRT_MAKE_JOBS: "1"
          ASUSWRT_PREPARE_JOBS: "4"
          ASUSWRT_OUTPUT_DIR: ${{ github.workspace }}/output
          ASUSWRT_SOURCE_REPO: ${{ github.workspace }}/source
          ASUSWRT_SOURCE_ROOT: ${{ github.workspace }}/source
          ASUSWRT_TOOLCHAIN_VIEW: ${{ runner.temp }}/asuswrt-toolchain-view/brcm-arm-hnd
          ASUSWRT_TOOLCHAINS_STATE: ${{ steps.revisions.outputs.toolchains_sha }}
          ROUTER_PACKAGE_JOBS: "1"
          RUST_TARGET_DIR: ${{ runner.temp }}/asuswrt-rust-target
        run: |
          set -euo pipefail
          bash overlay/.github/ci/gt-ax11000/build.sh gt-ax11000 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            df -h "$GITHUB_WORKSPACE"
            du -sh source toolchains output 2>/dev/null || true
            sleep 60
          done
          wait "$build_pid"

      - name: Verify Rust firmware ISA and runtime
        run: |
          set -euo pipefail
          infosvr=$(find source/release/src-rt-5.02axhnd/targets \
            -type f -path '*/fs/usr/sbin/infosvr' -print -quit)
          test -n "$infosvr"
          rootfs=${infosvr%/usr/sbin/infosvr}
          toolchain_bin="$GITHUB_WORKSPACE/toolchains/brcm-arm-hnd/crosstools-arm-gcc-5.5-linux-4.1-glibc-2.26-binutils-2.28.1/bin"
          bash overlay/.github/ci/gt-ax11000/tests/verify-rust-firmware.sh \
            "$rootfs" "$toolchain_bin" "$(command -v qemu-arm)"

      - name: Show compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/asuswrt-ccache
        run: ccache --show-stats --verbose || true

      - name: Record build metadata
        if: success()
        run: |
          {
            echo "upstream_sha=$(git -C source rev-parse HEAD)"
            echo "toolchains_sha=$(git -C toolchains rev-parse HEAD)"
            echo "ci_sha=${GITHUB_SHA}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "ccache_exact_hit=${{ steps.ccache.outputs.cache-hit }}"
            echo "prepare_jobs=4"
            echo "rust_toolchain=1.85.1"
          } > output/BUILD-METADATA.txt
          (cd output && sha256sum GT-AX11000*.w | tee SHA256SUMS)
          find output -maxdepth 1 -type f -printf '%s %f\n' | sort -n

      - name: Collect failure log
        if: failure()
        run: |
          mkdir -p output
          printf 'GitHub Actions run: %s\nCommit: %s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$GITHUB_SHA" > output/CI-FAILURE.txt
          cp -f source/release/src-rt-5.02axhnd/output-gt-ax11000-wsl.log output/ 2>/dev/null || true

      - name: Upload firmware and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gt-ax11000-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
