name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Create or update an upstream-sync branch and PR
        env:
          # GitHub never runs workflows for pushes, PRs or issues created with
          # GITHUB_TOKEN, so a sync PR opened with the github.token fallback
          # gets no checks until somebody pushes to its branch or closes and
          # reopens it. SYNC_UPSTREAM_TOKEN is a repo-owner-provided PAT or
          # App token with contents, issues and pull-requests write access.
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}
          SYNC_TOKEN_PROVIDED: ${{ secrets.SYNC_UPSTREAM_TOKEN != '' }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" repo -- \
            --filter=blob:none --no-checkout
          # gh leaves the https origin without credentials; the push needs them.
          git -C repo remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C repo sparse-checkout init --cone
          git -C repo sparse-checkout set .github/ci/gt-ax11000
          git -C repo checkout main
          git -C repo config user.name github-actions[bot]
          git -C repo config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # git -C "$source" apply resolves patch arguments in the source tree,
          # not in this shell's current directory. Keep every overlay path absolute.
          overlay_root="$GITHUB_WORKSPACE/repo/.github/ci/gt-ax11000"
          lock="$overlay_root/inputs.lock"
          tool="$overlay_root/tools/input_lock.py"
          patch_root="$overlay_root/patches"
          upstream_repo=$(python3 "$tool" get upstream_repo --lock "$lock")
          locked_upstream=$(python3 "$tool" get upstream_sha --lock "$lock")

          # BEGIN locked upstream remote (also executed by ci-workflow.test.cjs)
          # gh repo clone automatically adds upstream when cloning a fork.
          if git -C repo remote get-url upstream >/dev/null 2>&1; then
            git -C repo remote set-url upstream "$upstream_repo"
          else
            git -C repo remote add upstream "$upstream_repo"
          fi
          # END locked upstream remote
          git -C repo fetch --no-tags upstream main
          upstream_sha=$(git -C repo rev-parse upstream/main)
          short_sha=${upstream_sha:0:12}
          branch="upstream-sync/$short_sha"
          git -C repo checkout -B "$branch" origin/main
          if git -C repo merge-base --is-ancestor "$upstream_sha" origin/main; then
            if [ "$upstream_sha" = "$locked_upstream" ]; then
              echo "Fork already locks and contains upstream $upstream_sha"
              exit 0
            fi
            # Nothing to merge; only the stale lock needs regenerating.
            echo "Fork already contains upstream $upstream_sha; refreshing the stale lock"
          elif ! git -C repo merge --no-edit --no-ff "$upstream_sha"; then
            conflicts=$(git -C repo diff --name-only --diff-filter=U)
            git -C repo merge --abort
            if [ -n "$conflicts" ]; then
              conflicts=$(printf '%s\n' "$conflicts" | sed 's/.*/- `&`/')
            else
              conflicts='- (no conflicting paths reported; see the workflow log)'
            fi
            issue_title="upstream-sync conflict $short_sha"
            issue_body=$(printf '%s\n\n%s\n\n%s\n%s\n' \
              "Merging upstream \`$upstream_sha\` into \`main\` conflicts in:" \
              "$conflicts" \
              'Resolve the merge by hand, then re-run the Sync upstream workflow.' \
              "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "\"$issue_title\" in:title" --json number,title \
              --jq "first(.[] | select(.title == \"$issue_title\") | .number) // empty")
            if [ -n "$existing_issue" ]; then
              gh issue edit "$existing_issue" --repo "$GITHUB_REPOSITORY" \
                --body "$issue_body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$issue_title" --body "$issue_body"
            fi
            echo "::error::Merging upstream $upstream_sha into main conflicts; see issue '$issue_title'"
            exit 1
          fi
          test "$(git -C repo rev-parse HEAD:release)" = \
            "$(git -C repo rev-parse "$upstream_sha:release")"

          source="$RUNNER_TEMP/upstream-source"
          git init "$source"
          git -C "$source" remote add origin "$upstream_repo"
          git -C "$source" sparse-checkout init --cone
          git -C "$source" sparse-checkout set \
            release/src release/src-rt release/src-rt-5.02axhnd
          git -C "$source" fetch --depth=1 --filter=blob:none origin "$upstream_sha"
          git -C "$source" checkout --detach FETCH_HEAD
          while IFS= read -r patch_name; do
            patch_name=${patch_name%%#*}
            patch_name=${patch_name//[[:space:]]/}
            test -n "$patch_name" || continue
            git -C "$source" apply --recount --check "$patch_root/$patch_name"
            git -C "$source" apply --recount "$patch_root/$patch_name"
          done < "$patch_root/series"
          patched_diff=$(python3 "$tool" diff-hash --source "$source")
          python3 "$tool" update \
            --lock "$lock" \
            --upstream-sha "$upstream_sha" \
            --patched-diff-sha256 "$patched_diff"
          git -C repo add -- .github/ci/gt-ax11000/inputs.lock
          if ! git -C repo diff --cached --quiet; then
            git -C repo commit -m "Lock GT-AX11000 inputs to upstream $short_sha"
          fi
          if [ "$(git -C repo rev-parse HEAD)" = "$(git -C repo rev-parse origin/main)" ]; then
            echo "Nothing to sync: upstream $upstream_sha is merged and the lock is unchanged"
            exit 0
          fi

          git -C repo push --force-with-lease origin "$branch"
          title="Sync RMerl/main to $short_sha"
          if [ "$SYNC_TOKEN_PROVIDED" = true ]; then
            checks='- Required Rust, security-overlay and firmware checks run on this PR and must pass before review.'
          else
            checks='- Opened with GITHUB_TOKEN, so no checks run automatically: push to the branch or close and reopen this PR to run the required Rust, security-overlay and firmware checks, which must pass before review.'
          fi
          body=$(printf '%s\n\n%s\n%s\n%s\n' \
            'Automated upstream synchronization. This PR is never merged automatically.' \
            "- Upstream: \`$upstream_sha\`" \
            "- Patched source diff: \`$patched_diff\`" \
            "$checks")
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
            gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body "$body" --draft
          fi
